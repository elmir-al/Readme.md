name: Albay v4.1.0 Phase 30 Android Device Kit

on:
  pull_request:
    branches: [main]
    paths:
      - 'phase30_android_build_only.sh'
      - 'phase30_tb3_generate.cpp'
      - 'phase30_audit_android_elf.py'
      - 'phase30_audit_native_exports.py'
      - 'phase29_v410_overlay10/**'
      - '.github/workflows/phase30-r29-device-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and audit exact Android ARM64 library
        shell: bash
        run: bash phase30_android_build_only.sh
      - name: Upload evidence on every result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-v4.1.0-Phase30-evidence-${{ github.run_number }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified Android device kit
        uses: actions/upload-artifact@v4
        with:
          name: Albay-v4.1.0-Phase30-DEVICE-TEST-KIT
          path: artifact/
          if-no-files-found: error
          retention-days: 30
