name: Albay 1.0.43 V14 ARM64 Final Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_source/v14_hotpath_1043.patch.gz.b64"
      - ".github/workflows/build-albay-v14-arm64-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and apply verified patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          exec > >(tee artifact/reconstruct.log) 2>&1
          test "$(find ci_source -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 9
          cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo "1f137dcfda27a3484f07e40c9e1dc38687f68f137777e626135425dd9cb4756e  /tmp/albay.tar.xz" | sha256sum -c --strict
          rm -rf /tmp/albay && mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          SRC=/tmp/albay/albay_minimal
          patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/russian_king_forced_continuation_1042.patch
          echo "2b6b6d2f97f58f1625bdb1af1f40f0ab8a6b693333c20a21b799abd95815b285  ci_source/v14_hotpath_1043.patch.gz.b64" | sha256sum -c --strict
          base64 --decode ci_source/v14_hotpath_1043.patch.gz.b64 | gzip -dc > /tmp/v14.patch
          echo "f9123bfb288bebc063fb56a594b0c36c615b2a1edcbc5bdba6197155ab1bb13a  /tmp/v14.patch" | sha256sum -c --strict
          patch -d "$SRC" -p1 --forward --batch --verbose < /tmp/v14.patch
          grep -q 'kEngineVersion = "1.0.43"' "$SRC/include/albay/types.hpp"
          grep -q 'std::atomic<SharedSearchState\*> session_state_raw_' "$SRC/include/albay/search.hpp"
          grep -q 'session_state_raw_.store(session_raw' "$SRC/src/search.cpp"
          grep -q 'exact_root_tablebase_result' "$SRC/src/search.cpp"
          grep -q 'const bool live_search = is_searching();' "$SRC/src/search.cpp"
          grep -q 'P31_CHECK(final_info.nodes == 0);' "$SRC/tests/strength_phase31_tests.cpp"
          grep -q 'This is not the Brazilian maximum-capture rule' "$SRC/src/movegen.cpp"

      - name: Install NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Configure and build portable ARM64 library
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          SRC=/tmp/albay/albay_minimal
          cmake -S "$SRC" -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=OFF -DALBAY_BUILD_JNI=OFF \
            -DALBAY_ENABLE_LTO=OFF -DALBAY_ENABLE_THIN_LTO=OFF \
            -DALBAY_ENABLE_PGO_GENERATE=OFF -DALBAY_ENABLE_PGO_USE=OFF \
            -DALBAY_ANDROID_CPU_PROFILE=portable -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON
          cmake --build build --target albay --parallel 2 --verbose 2>&1 | tee artifact/build.log

      - name: Verify ELF, exports, dependencies and package
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLS/llvm-strip" --strip-unneeded build/libalbay.so
          cp build/libalbay.so artifact/libalbay.so
          "$TOOLS/llvm-readelf" -h artifact/libalbay.so > artifact/elf-header.txt
          "$TOOLS/llvm-readelf" -d artifact/libalbay.so > artifact/dynamic-dependencies.txt
          "$TOOLS/llvm-readelf" -l artifact/libalbay.so > artifact/program-headers.txt
          "$TOOLS/llvm-nm" -D --defined-only artifact/libalbay.so > artifact/exports.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' artifact/elf-header.txt
          grep -Eq 'Type:[[:space:]]+DYN' artifact/elf-header.txt
          ! grep -Eq 'libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so' artifact/dynamic-dependencies.txt
          for symbol in create start_search get_best_move get_evaluation_scale destroy; do
            grep -Eq "albay_engine_${symbol}$" artifact/exports.txt
          done
          test "$(grep -Ec ' albay_engine_[A-Za-z0-9_]+$' artifact/exports.txt)" -eq 27
          awk '$1 == "LOAD" {print}' artifact/program-headers.txt > artifact/load-segments.txt
          grep -Eq '0x0*4000([[:space:]]|$)' artifact/load-segments.txt
          sha256sum artifact/libalbay.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Engine: Albay 1.0.43 V14 Turbo
          Source base: Albay 1.0.42 Russian forced-continuation build
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Minimum API: 29
          C++ runtime: c++_static
          CPU: portable ARMv8-A
          ELF LOAD alignment: 16 KiB
          C API exports: 27
          Hot path: atomic non-owning search-session pointer with owning shared_ptr lifetime guard
          Root exact-tablebase SMP telemetry: completed polling preserves nodes=0 and DTW selective depth
          ThinLTO/PGO: disabled after non-positive controlled host comparisons
          Russian king forced-continuation source gate: PASS
          Physical Android/Pydroid thermal and long-game validation: pending on device
          EOF
          {
            echo "AArch64 ELF: PASS"
            echo "ET_DYN: PASS"
            echo "No GNU/shared libc++ dependency: PASS"
            echo "27 C API exports: PASS"
            echo "16 KiB LOAD alignment: PASS"
            echo "Albay 1.0.43 hot-path source gate: PASS"
            echo "Completed exact-tablebase polling contract source gate: PASS"
            echo "Russian forced-continuation source gate: PASS"
          } > artifact/verification.txt

      - name: Upload verified library
        uses: actions/upload-artifact@v4
        with:
          name: Albay-1.0.43-V14-Turbo-Android-arm64-v8a-NDK-r29-static
          path: artifact/
          if-no-files-found: error
          retention-days: 30
