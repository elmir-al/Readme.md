name: Build Albay 2.3.1 Phase28F Android ARM64

on:
  pull_request:
    branches: [main]
    paths:
      - "phase28f_source/**"
      - ".github/workflows/build-albay-231-phase28f.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact /tmp/albay231
          cat phase28f_source/part-*.b64 | base64 --decode > /tmp/albay231.tar.xz
          echo "0b1526a8e07ee196feea034df32895392f4d5fa4c998623b45811340d5fd2ad6  /tmp/albay231.tar.xz" | sha256sum -c --strict
          tar -xJf /tmp/albay231.tar.xz -C /tmp/albay231
          grep -q 'project(Albay VERSION 2.3.1' /tmp/albay231/CMakeLists.txt
          grep -R -q '2.3.1-book2-nnue3k100-tb5k32-rules2' /tmp/albay231/include /tmp/albay231/src
          sha256sum /tmp/albay231.tar.xz > artifact/SOURCE_SHA256.txt

      - name: Install NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          cmake -S /tmp/albay231 -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF \
            -DALBAY_BUILD_TOOLS=OFF \
            -DALBAY_BUILD_MATCH_PLUGIN=OFF \
            -DALBAY_USE_SANITIZERS=OFF \
            -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON 2>&1 | tee artifact/configure.log
          cmake --build build-android --target albay --parallel 2 --verbose 2>&1 | tee artifact/build.log

      - name: Verify Android binary
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cp build-android/libalbay.so artifact/libalbay.unstripped.so
          "$TOOLS/llvm-strip" --strip-unneeded build-android/libalbay.so
          cp build-android/libalbay.so artifact/libalbay.so
          "$TOOLS/llvm-readelf" -h artifact/libalbay.so > artifact/elf-header.txt
          "$TOOLS/llvm-readelf" -d artifact/libalbay.so > artifact/dynamic-dependencies.txt
          "$TOOLS/llvm-readelf" -l artifact/libalbay.so > artifact/program-headers.txt
          "$TOOLS/llvm-nm" -D --defined-only artifact/libalbay.so > artifact/exports.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' artifact/elf-header.txt
          grep -Eq 'Type:[[:space:]]+DYN' artifact/elf-header.txt
          ! grep -Eq 'TEXTREL|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so' artifact/dynamic-dependencies.txt
          test "$(grep -Ec ' albay_engine_[A-Za-z0-9_]+$' artifact/exports.txt)" -eq 23
          test "$(grep -Ec ' Java_com_albay_engine_AlbayEngine_[A-Za-z0-9_]+$' artifact/exports.txt)" -eq 23
          awk '$1 == "LOAD" {print}' artifact/program-headers.txt > artifact/load-segments.txt
          test -s artifact/load-segments.txt
          ! awk '$1 == "LOAD" && $NF != "0x4000" {bad=1} END {exit bad}' artifact/load-segments.txt
          sha256sum artifact/libalbay.so artifact/libalbay.unstripped.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Engine: Albay 2.3.1-book2-nnue3k100-tb5k32-rules2
          Source archive SHA-256: 0b1526a8e07ee196feea034df32895392f4d5fa4c998623b45811340d5fd2ad6
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Minimum API: 29
          C++ runtime: c++_static
          CPU profile: portable ARMv8-A
          ELF LOAD alignment: 16 KiB
          C API exports: 23
          JNI exports: 23
          NNUE: NNUE3K100 embedded
          5K32 support: compiled; external exact tablebase file required
          EOF
          {
            echo 'ELF64 AArch64: PASS'
            echo 'ET_DYN: PASS'
            echo 'No TEXTREL/shared C++ runtime: PASS'
            echo '23 C API exports: PASS'
            echo '23 JNI exports: PASS'
            echo '16 KiB LOAD alignment: PASS'
          } > artifact/verification.txt

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: Albay-2.3.1-Android-arm64-v8a-NDK-r29-Phase28F
          path: artifact/
          if-no-files-found: error
          retention-days: 30
