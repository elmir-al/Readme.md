name: Phase24 Albay 2.2.0 Android ARM64

on:
  push:
    branches: [phase24-android-2.2.0]
    paths: ["phase24_ci/**", ".github/workflows/build-android-arm64.yml"]
  pull_request:
    branches: [main]
    paths: ["phase24_ci/**", ".github/workflows/build-android-arm64.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find phase24_ci -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 10
          cat phase24_ci/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo '5d20ad3ad07b3c6ceeb18c295db7ad9871422d52d90f39c1fa95a0e022e2c900  /tmp/albay.tar.xz' | sha256sum -c --strict
          mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          test -f /tmp/albay/albay-2.2.0/CMakeLists.txt
          test -f /tmp/albay/albay-2.2.0/jni/albay_jni.cpp

      - name: Install exact NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'ndk;29.0.14206865'
          grep -q 'Pkg.Revision = 29.0.14206865' "${ANDROID_SDK_ROOT}/ndk/29.0.14206865/source.properties"

      - name: Build arm64-v8a API 29
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          cmake -S /tmp/albay/albay-2.2.0 -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=OFF \
            -DALBAY_BUILD_MATCH_PLUGIN=OFF -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON \
            2>&1 | tee configure.log
          cmake --build build --target albay --parallel 2 --verbose 2>&1 | tee build.log

      - name: Verify ELF and exact public exports
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p artifact/arm64-v8a artifact/evidence
          cp build/libalbay.so artifact/arm64-v8a/libalbay.unstripped.so
          "$TOOLS/llvm-strip" --strip-unneeded build/libalbay.so
          cp build/libalbay.so artifact/arm64-v8a/libalbay.so
          "$TOOLS/llvm-readelf" -hW build/libalbay.so > artifact/evidence/elf-header.txt
          "$TOOLS/llvm-readelf" -dW build/libalbay.so > artifact/evidence/dynamic.txt
          "$TOOLS/llvm-readelf" -lW build/libalbay.so > artifact/evidence/program-headers.txt
          "$TOOLS/llvm-nm" -D --defined-only build/libalbay.so > artifact/evidence/exports.txt
          strings build/libalbay.so | grep -F '2.2.0-book2-nnue2q2-rules2' > artifact/evidence/embedded-version.txt
          python3 - <<'PY'
          import pathlib,re
          r=pathlib.Path('artifact/evidence')
          h=(r/'elf-header.txt').read_text(); d=(r/'dynamic.txt').read_text(); p=(r/'program-headers.txt').read_text()
          lines=(r/'exports.txt').read_text().splitlines(); syms={x.split()[-1] for x in lines if x.split()}
          assert re.search(r'Class:\s+ELF64',h) and re.search(r'Machine:\s+AArch64',h) and re.search(r'Type:\s+DYN',h)
          assert 'TEXTREL' not in d
          assert not any(x in d for x in ('libc++_shared.so','libstdc++.so','libstdc++.so.6','libgcc_s.so','libgcc_s.so.1'))
          aligns=[int(x.split()[-1],16) for x in p.splitlines() if re.match(r'\s*LOAD\s',x)]
          assert aligns and min(aligns)>=0x4000, aligns
          c_expected={'albay_engine_'+x for x in 'create destroy evaluate_position generate_legal_moves get_author get_best_move get_multipv get_name get_position get_principal_variation get_search_info get_version is_legal_move is_searching make_move new_game pause_search resume_search set_option set_position start_search stop_search undo_move'.split()}
          j_expected={'Java_com_albay_engine_AlbayEngine_native'+x for x in 'Create Destroy EvaluatePosition GenerateLegalMoves GetAuthor GetBestMove GetMultiPv GetName GetPosition GetPrincipalVariation GetSearchInfo GetVersion IsLegalMove IsSearching MakeMove NewGame PauseSearch ResumeSearch SetOption SetPosition StartSearch StopSearch UndoMove'.split()}
          c_actual={x for x in syms if x.startswith('albay_engine_')}; j_actual={x for x in syms if x.startswith('Java_com_albay_engine_AlbayEngine_')}
          assert c_actual==c_expected,(sorted(c_expected-c_actual),sorted(c_actual-c_expected))
          assert j_actual==j_expected,(sorted(j_expected-j_actual),sorted(j_actual-j_expected))
          (r/'verification.txt').write_text('ELF64 AArch64 ET_DYN: PASS\nLOAD alignments: '+str([hex(x) for x in aligns])+'\nTEXTREL: none\nDynamic C++ runtime: none\nC API: 23/23 exact\nJNI: 23/23 exact\nVersion: 2.2.0-book2-nnue2q2-rules2\n')
          PY
          cp configure.log build.log artifact/evidence/
          sha256sum artifact/arm64-v8a/libalbay.so artifact/arm64-v8a/libalbay.unstripped.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Engine: Albay 2.2.0-book2-nnue2q2-rules2
          Source SHA-256: 5d20ad3ad07b3c6ceeb18c295db7ad9871422d52d90f39c1fa95a0e022e2c900
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Minimum API: 29
          STL: c++_static
          CPU: portable ARMv8-A
          ELF LOAD alignment: >=16 KiB
          C API/JNI exports: 23/23 exact
          Physical-device execution: pending
          EOF

      - name: Upload verified library and evidence
        uses: actions/upload-artifact@v4
        with:
          name: Albay-2.2.0-Android-arm64-v8a-NDK-r29
          path: artifact/
          if-no-files-found: error
          retention-days: 30
