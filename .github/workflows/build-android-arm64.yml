name: Build Albay Android ARM64

on:
  push:
    branches: [main]
    paths: ["ci_source/**", ".github/workflows/build-android-arm64.yml"]
  pull_request:
    branches: [main]
    paths: ["ci_source/**", ".github/workflows/build-android-arm64.yml", "ci_trigger/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ci_source -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 9
          cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo "1f137dcfda27a3484f07e40c9e1dc38687f68f137777e626135425dd9cb4756e  /tmp/albay.tar.xz" | sha256sum -c --strict
          echo "0bbd1e0230cdd08a877e5031d44caf26b3de3bdce35d4cc8097f73833fda47de  ci_source/android_ndk_shared_ptr.patch" | sha256sum -c --strict
          echo "7ad8e5b2e57f07bd2ca62b20bcea570b3f731ae650f2de02b360193305c2e4b0  ci_source/evaluation_scale_compat.patch" | sha256sum -c --strict
          mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          SRC=/tmp/albay/albay_minimal
          patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
          grep -q 'std::shared_ptr<SharedSearchState> shared_state() const' "$SRC/include/albay/search.hpp"
          grep -q 'std::atomic_load_explicit(&shared_state_owner_' "$SRC/include/albay/search.hpp"
          grep -q 'mutable std::shared_ptr<SharedSearchState> shared_state_owner_' "$SRC/include/albay/search.hpp"
          ! grep -q 'shared_state_ptr_' "$SRC/include/albay/search.hpp"
          grep -q 'albay_engine_get_evaluation_scale' "$SRC/include/albay/c_api.h"
          grep -q 'return 10000;' "$SRC/src/c_api.cpp"

      - name: Install NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Configure and build
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          cmake -S /tmp/albay/albay_minimal -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=OFF -DALBAY_BUILD_JNI=OFF \
            -DALBAY_ENABLE_LTO=OFF -DALBAY_ENABLE_THIN_LTO=OFF \
            -DALBAY_ENABLE_PGO_GENERATE=OFF -DALBAY_ENABLE_PGO_USE=OFF \
            -DALBAY_ANDROID_CPU_PROFILE=portable -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON
          mkdir -p artifact
          cmake --build build --target albay --parallel 2 --verbose 2>&1 | tee artifact/build.log

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLS/llvm-strip" --strip-unneeded build/libalbay.so
          cp build/libalbay.so artifact/libalbay.so
          "$TOOLS/llvm-readelf" -h artifact/libalbay.so > artifact/elf-header.txt
          "$TOOLS/llvm-readelf" -d artifact/libalbay.so > artifact/dynamic-dependencies.txt
          "$TOOLS/llvm-readelf" -l artifact/libalbay.so > artifact/program-headers.txt
          "$TOOLS/llvm-nm" -D --defined-only artifact/libalbay.so > artifact/exports.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' artifact/elf-header.txt
          grep -Eq 'Type:[[:space:]]+DYN' artifact/elf-header.txt
          ! grep -Eq 'libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so' artifact/dynamic-dependencies.txt
          for symbol in create start_search get_best_move get_evaluation_scale destroy; do
            grep -Eq "albay_engine_${symbol}$" artifact/exports.txt
          done
          test "$(grep -Ec ' albay_engine_[A-Za-z0-9_]+$' artifact/exports.txt)" -eq 27
          awk '$1 == "LOAD" {print}' artifact/program-headers.txt > artifact/load-segments.txt
          grep -Eq '0x0*4000([[:space:]]|$)' artifact/load-segments.txt
          sha256sum artifact/libalbay.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Source version: 1.0.38
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Minimum API: 29
          C++ runtime: c++_static
          CPU: portable ARMv8-A
          ELF LOAD alignment: 16 KiB
          C API exports: 27
          Evaluation scale: 10000
          Android shared-state model: atomic shared_ptr snapshots (no raw pointer)
          Host Release tests after patches: 47/47 passed
          EOF
          {
            echo "ELF AArch64: PASS"
            echo "ET_DYN: PASS"
            echo "No GNU/shared C++ runtime: PASS"
            echo "27 C API exports: PASS"
            echo "10000 evaluation scale export: PASS"
            echo "16 KiB LOAD alignment: PASS"
            echo "Raw-pointer shared-state bridge absent: PASS"
          } > artifact/verification.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-verification-${{ github.run_number }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified library
        uses: actions/upload-artifact@v4
        with:
          name: Albay-1.0.38-Android-arm64-v8a-NDK-r29-static
          path: artifact/
          if-no-files-found: error
          retention-days: 30
