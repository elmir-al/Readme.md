name: Albay Brazilian 1.0.0 Final ARM64 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-albay-brazil-final.yml"
      - "ci_source/albay_brazil_1.0.0.patch.gz.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and apply Brazilian source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          exec > >(tee artifact/reconstruct.log) 2>&1
          test "$(find ci_source -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 9
          cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo "1f137dcfda27a3484f07e40c9e1dc38687f68f137777e626135425dd9cb4756e  /tmp/albay.tar.xz" | sha256sum -c --strict
          rm -rf /tmp/albay && mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          SRC=/tmp/albay/albay_minimal
          patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/russian_king_forced_continuation_1042.patch
          base64 --decode ci_source/albay_brazil_1.0.0.patch.gz.b64 | gzip -dc > /tmp/brazil.patch
          echo "2bd9766d0e26fada49b3162db38bd5e427c779d477e5b904150bbd7c566dc19f  /tmp/brazil.patch" | sha256sum -c --strict
          patch -d "$SRC" -p1 --forward --batch --verbose < /tmp/brazil.patch
          grep -q 'kEngineVersion = "1.0.0"' "$SRC/include/albay/types.hpp"
          grep -q 'Albay Brazilian Draughts Engine' "$SRC/include/albay/types.hpp"
          grep -q 'maximum_capture_count' "$SRC/src/movegen.cpp"
          grep -q 'canonical_move_less' "$SRC/src/search.cpp"
          grep -q 'kInlineCapacity' "$SRC/include/albay/move.hpp"

      - name: Host Brazilian core tests
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/albay/albay_minimal
          cmake -S "$SRC" -B host -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=ON -DALBAY_BUILD_TOOLS=OFF -DALBAY_BUILD_JNI=OFF
          cmake --build host --target albay_tests albay_search_tests albay_smp_tests albay_c_api_tests --parallel 2
          host/albay_tests | tee artifact/HOST_RULES_TESTS.txt
          host/albay_search_tests | tee artifact/HOST_SEARCH_TESTS.txt
          host/albay_smp_tests | tee artifact/HOST_SMP_TESTS.txt
          host/albay_c_api_tests | tee artifact/HOST_C_API_TESTS.txt

      - name: Install NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Build Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          SRC=/tmp/albay/albay_minimal
          cmake -S "$SRC" -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=OFF -DALBAY_BUILD_JNI=OFF \
            -DALBAY_ENABLE_LTO=OFF -DALBAY_ENABLE_THIN_LTO=OFF \
            -DALBAY_ENABLE_PGO_GENERATE=OFF -DALBAY_ENABLE_PGO_USE=OFF \
            -DALBAY_ANDROID_CPU_PROFILE=portable -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON
          cmake --build build --target albay --parallel 2 --verbose 2>&1 | tee artifact/android-build.log

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLS/llvm-strip" --strip-unneeded build/libalbay.so
          cp build/libalbay.so artifact/libalbay.so
          cp /tmp/albay/albay_minimal/include/albay/c_api.h artifact/albay_c_api.h
          "$TOOLS/llvm-readelf" -h artifact/libalbay.so > artifact/elf-header.txt
          "$TOOLS/llvm-readelf" -d artifact/libalbay.so > artifact/dynamic-dependencies.txt
          "$TOOLS/llvm-readelf" -l artifact/libalbay.so > artifact/program-headers.txt
          "$TOOLS/llvm-nm" -D --defined-only artifact/libalbay.so > artifact/exports.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' artifact/elf-header.txt
          grep -Eq 'Type:[[:space:]]+DYN' artifact/elf-header.txt
          ! grep -Eq 'libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so' artifact/dynamic-dependencies.txt
          test "$(grep -Ec ' albay_engine_[A-Za-z0-9_]+$' artifact/exports.txt)" -eq 27
          awk '$1 == "LOAD" {print}' artifact/program-headers.txt > artifact/load-segments.txt
          grep -Eq '0x0*4000([[:space:]]|$)' artifact/load-segments.txt
          sha256sum artifact/libalbay.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Engine: Albay Brazilian Draughts Engine 1.0.0
          Variant: Brazilian draughts 8x8
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Minimum API: 29
          Runtime: c++_static
          CPU: portable ARMv8-A
          ELF LOAD alignment: 16 KiB
          C API exports: 27
          Brazilian rules/core/search/SMP/C API: PASS
          Russian NNUE/tablebase assets: not bundled
          EOF
          cat > artifact/verification.txt <<'EOF'
          Brazilian source gates: PASS
          Host core tests: PASS
          AArch64 ELF: PASS
          ET_DYN: PASS
          Static C++ runtime: PASS
          27 C API exports: PASS
          16 KiB LOAD alignment: PASS
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Albay-1.0.0-Brazilian-Android-arm64-v8a-NDK-r29
          path: artifact/
          if-no-files-found: error
          retention-days: 30
