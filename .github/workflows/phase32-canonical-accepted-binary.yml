name: Albay v4.1.0 Phase 32 Canonical Accepted Binary

on:
  pull_request:
    branches: [main]
    paths:
      - 'phase32_reproduce_accepted_binary.sh'
      - 'phase29_v410_overlay10/**'
      - 'phase30_audit_android_elf.py'
      - 'phase30_audit_native_exports.py'
      - 'phase30_tb3_generate.cpp'
      - '.github/workflows/phase32-canonical-accepted-binary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproduce the physically tested Android binary twice
        shell: bash
        run: bash phase32_reproduce_accepted_binary.sh
      - name: Upload canonical reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-v4.1.0-Phase32-Canonical-Accepted-Binary-${{ github.run_number }}
          path: artifact-phase32-canonical/
          if-no-files-found: warn
          retention-days: 30
