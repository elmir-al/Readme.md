name: Build Albay 1.0.43 V14 Turbo ARM64

on:
  push:
    branches: [albay-v14-turbo-build]
    paths:
      - "ci_source/v14_hotpath_1043.patch.gz.b64"
      - ".github/workflows/build-albay-v14-turbo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Albay 1.0.42 and apply V14 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          exec > >(tee artifact/reconstruct.log) 2>&1
          test "$(find ci_source -maxdepth 1 -name 'part-*.b64' | wc -l)" -eq 9
          cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo "1f137dcfda27a3484f07e40c9e1dc38687f68f137777e626135425dd9cb4756e  /tmp/albay.tar.xz" | sha256sum -c --strict
          rm -rf /tmp/albay
          mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          SRC=/tmp/albay/albay_minimal
          patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/russian_king_forced_continuation_1042.patch
          echo "ec59e2049a9967ba2109afd5c99bfc98819321144d9d90fe70a3e3693e5c2fae  ci_source/v14_hotpath_1043.patch.gz.b64" | sha256sum -c --strict
          base64 --decode ci_source/v14_hotpath_1043.patch.gz.b64 | gzip -dc > /tmp/v14.patch
          echo "29e4044959dec5621dbd24ac874f88d144a68b9cad47711f3c9076758e962e16  /tmp/v14.patch" | sha256sum -c --strict
          cp -a "$SRC" /tmp/albay/albay_baseline_1042
          patch -d "$SRC" -p1 --forward --batch --verbose < /tmp/v14.patch
          grep -q 'kEngineVersion = "1.0.43"' "$SRC/include/albay/types.hpp"
          grep -q 'std::atomic<SharedSearchState\*> session_state_raw_' "$SRC/include/albay/search.hpp"
          grep -q 'session_state_raw_.store(session_raw' "$SRC/src/search.cpp"
          grep -q 'SharedSearchState\* state = session_state();' "$SRC/src/search.cpp"

      - name: Host baseline versus V14 benchmark
        shell: bash
        run: |
          set -euo pipefail
          BASE=/tmp/albay/albay_baseline_1042
          V14=/tmp/albay/albay_minimal
          for item in base v14; do
            if [ "$item" = base ]; then SRC="$BASE"; else SRC="$V14"; fi
            cmake -S "$SRC" -B "host-$item" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=ON -DALBAY_BUILD_JNI=OFF
            cmake --build "host-$item" --target albay albay_benchmark --parallel 2
          done
          python3 - <<'PY'
          import json, random, re, statistics, subprocess
          bins={'base':'host-base/albay_benchmark','v14':'host-v14/albay_benchmark'}
          labels=['base','v14']*8
          random.Random(1043).shuffle(labels)
          rows=[]; values={k:[] for k in bins}
          for label in labels:
              proc=subprocess.run([bins[label],'14'],check=True,text=True,capture_output=True)
              total=int(re.search(r'total_time_ms=(\d+)',proc.stdout).group(1))
              nodes=int(re.search(r'total_nodes=(\d+)',proc.stdout).group(1))
              values[label].append(total)
              rows.append({'build':label,'time_ms':total,'nodes':nodes})
          report={'runs':rows}
          for label,vals in values.items():
              report[label]={'median_ms':statistics.median(vals),'mean_ms':statistics.mean(vals),'runs_ms':vals}
          report['median_speedup']=report['base']['median_ms']/report['v14']['median_ms']
          report['same_nodes']=len({r['nodes'] for r in rows}) == 1
          open('artifact/HOST_V14_BENCHMARK.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          assert report['same_nodes']
          assert report['median_speedup'] > 1.05
          PY
          python3 - <<'PY'
          import ctypes
          from pathlib import Path
          lib=ctypes.CDLL(str(Path('host-v14/libalbay.so').resolve()))
          lib.albay_engine_create.restype=ctypes.c_void_p
          lib.albay_engine_destroy.argtypes=[ctypes.c_void_p]
          lib.albay_engine_get_version.restype=ctypes.c_char_p
          lib.albay_engine_set_position.argtypes=[ctypes.c_void_p,ctypes.c_char_p]
          lib.albay_engine_set_position.restype=ctypes.c_int
          lib.albay_engine_generate_legal_moves.argtypes=[ctypes.c_void_p,ctypes.c_char_p,ctypes.c_size_t,ctypes.POINTER(ctypes.c_size_t)]
          lib.albay_engine_generate_legal_moves.restype=ctypes.c_int
          engine=lib.albay_engine_create(); assert engine
          try:
              assert lib.albay_engine_get_version().decode() == '1.0.43'
              assert lib.albay_engine_set_position(engine,b'W:WKa1,e3:Ba3,c3,g5;NP=0') == 0
              buf=ctypes.create_string_buffer(4096); required=ctypes.c_size_t()
              assert lib.albay_engine_generate_legal_moves(engine,buf,len(buf),ctypes.byref(required)) == 0
              assert buf.value.decode() == 'a1xf6xh4'
          finally:
              lib.albay_engine_destroy(engine)
          PY

      - name: Install Android NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Build Android ARM64 portable release
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          SRC=/tmp/albay/albay_minimal
          cmake -S "$SRC" -B android-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=OFF -DALBAY_BUILD_JNI=OFF \
            -DALBAY_ENABLE_LTO=OFF -DALBAY_ENABLE_THIN_LTO=OFF \
            -DALBAY_ENABLE_PGO_GENERATE=OFF -DALBAY_ENABLE_PGO_USE=OFF \
            -DALBAY_ANDROID_CPU_PROFILE=portable -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON
          cmake --build android-build --target albay --parallel 2 --verbose 2>&1 | tee artifact/android-build.log

      - name: Verify Android binary
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLS/llvm-strip" --strip-unneeded android-build/libalbay.so
          cp android-build/libalbay.so artifact/libalbay.so
          "$TOOLS/llvm-readelf" -h artifact/libalbay.so > artifact/elf-header.txt
          "$TOOLS/llvm-readelf" -d artifact/libalbay.so > artifact/dynamic-dependencies.txt
          "$TOOLS/llvm-readelf" -l artifact/libalbay.so > artifact/program-headers.txt
          "$TOOLS/llvm-nm" -D --defined-only artifact/libalbay.so > artifact/exports.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' artifact/elf-header.txt
          grep -Eq 'Type:[[:space:]]+DYN' artifact/elf-header.txt
          ! grep -Eq 'libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so' artifact/dynamic-dependencies.txt
          test "$(grep -Ec ' albay_engine_[A-Za-z0-9_]+$' artifact/exports.txt)" -eq 27
          awk '$1 == "LOAD" {print}' artifact/program-headers.txt > artifact/load-segments.txt
          grep -Eq '0x0*4000([[:space:]]|$)' artifact/load-segments.txt
          sha256sum artifact/libalbay.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.txt <<'EOF'
          Engine: Albay 1.0.43 V14 Turbo
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Minimum API: 29
          C++ runtime: c++_static
          CPU profile: portable ARMv8-A
          ELF LOAD alignment: 16 KiB
          C API exports: 27
          Hot-path model: atomic raw session pointer plus owning shared_ptr lifetime guard
          Compiler LTO/PGO: disabled after neutral host comparison
          Russian king forced continuation regression: PASS
          EOF

      - name: Upload verified V14 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Albay-1.0.43-V14-Turbo-Android-arm64-v8a-NDK-r29-static
          path: artifact/
          if-no-files-found: error
          retention-days: 30
