name: Albay V17 Phase 2 ARM64 Pair

on:
  push:
    branches: ["agent/v17-phase2-arm64-pair"]
    paths:
      - "ci_source_v17/**"
      - ".github/workflows/v17-phase2-arm64-pair.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ci_source_v17/**"
      - ".github/workflows/v17-phase2-arm64-pair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v16-v17-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify source part count
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ci_source_v17 -maxdepth 1 -name 'part-[0-9][0-9].b64' | wc -l)" -eq 13

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/albay-v17
          cat ci_source_v17/part-[0-9][0-9].b64 | base64 --decode > /tmp/v17_phase2_ci_minimal.tar.xz

      - name: Verify source archive SHA256
        shell: bash
        run: |
          set -euo pipefail
          echo "535f88c9859128d9c55ba43d5d59515c5bd4a5a3a0a672f6dafc129b79488d23  /tmp/v17_phase2_ci_minimal.tar.xz" | sha256sum -c --strict

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/v17_phase2_ci_minimal.tar.xz -C /tmp/albay-v17
          test -f /tmp/albay-v17/v17_phase2_ci_minimal/CMakeLists.txt
          test -f /tmp/albay-v17/v17_phase2_ci_minimal/android/v17_phase2_baseline/include/albay/move.hpp

      - name: Verify V16 and V17 source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'alignas(Move) std::array<std::byte, sizeof(Move) * kInlineCapacity> inline_storage_;' /tmp/albay-v17/v17_phase2_ci_minimal/include/albay/move.hpp
          grep -Fq '::new (static_cast<void*>(inline_data() + size_)) Move' /tmp/albay-v17/v17_phase2_ci_minimal/include/albay/move.hpp
          grep -Fq 'std::array<Move, kInlineCapacity> inline_{};' /tmp/albay-v17/v17_phase2_ci_minimal/android/v17_phase2_baseline/include/albay/move.hpp
          ! grep -Fq 'inline_storage_' /tmp/albay-v17/v17_phase2_ci_minimal/android/v17_phase2_baseline/include/albay/move.hpp

      - name: Host build and rule smoke
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/albay-v17/v17_phase2_ci_minimal
          cmake -S "$SRC" -B /tmp/albay-v17/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF \
            -DALBAY_BUILD_TOOLS=OFF \
            -DALBAY_BUILD_JNI=OFF
          cmake --build /tmp/albay-v17/host --target albay --parallel 2
          python3 - <<'PY'
          import ctypes
          from pathlib import Path

          lib = ctypes.CDLL(str(Path('/tmp/albay-v17/host/libalbay.so')))
          lib.albay_engine_create.restype = ctypes.c_void_p
          lib.albay_engine_destroy.argtypes = [ctypes.c_void_p]
          lib.albay_engine_set_position.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          lib.albay_engine_set_position.restype = ctypes.c_int
          lib.albay_engine_generate_legal_moves.argtypes = [
              ctypes.c_void_p,
              ctypes.c_char_p,
              ctypes.c_size_t,
              ctypes.POINTER(ctypes.c_size_t),
          ]
          lib.albay_engine_generate_legal_moves.restype = ctypes.c_int

          engine = lib.albay_engine_create()
          assert engine
          try:
              assert lib.albay_engine_set_position(
                  engine, b'W:WKa1,e3:Ba3,c3,g5;NP=0'
              ) == 0
              needed = ctypes.c_size_t()
              buffer = ctypes.create_string_buffer(4096)
              assert lib.albay_engine_generate_legal_moves(
                  engine, buffer, len(buffer), ctypes.byref(needed)
              ) == 0
              assert buffer.value.decode() == 'a1xf6xh4', buffer.value
          finally:
              lib.albay_engine_destroy(engine)
          PY

      - uses: android-actions/setup-android@v3

      - name: Install pinned NDK r29
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"
          test -f "${ANDROID_SDK_ROOT}/ndk/29.0.14206865/source.properties"
          grep -q 'Pkg.Revision = 29.0.14206865' \
            "${ANDROID_SDK_ROOT}/ndk/29.0.14206865/source.properties"

      - name: Build identical-toolchain ARM64 pair
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          export ANDROID_API_LEVEL=29
          export CPU_PROFILE=portable
          export BUILD_JOBS=2
          SRC=/tmp/albay-v17/v17_phase2_ci_minimal
          chmod +x "$SRC/android/scripts/"*.sh
          "$SRC/android/scripts/build_v17_phase2_arm64_pair.sh"

      - name: Package evidence
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/albay-v17/v17_phase2_ci_minimal
          ART="$SRC/build/v17-phase2-arm64-pair/artifacts"
          test -s "$ART/libalbay_v16_baseline.so"
          test -s "$ART/libalbay_v17_phase2.so"
          test -s "$ART/V17_PHASE2_ARM64_PAIR_MANIFEST.json"
          test -s "$ART/V17_PHASE2_ARM64_PAIR_SHA256.txt"
          cp /tmp/v17_phase2_ci_minimal.tar.xz "$ART/"
          cat > "$ART/BUILD_CONTEXT.txt" <<'EOF'
          Albay: 1.0.45 V17 Movegen Hot-Path Phase 2
          NDK: 29.0.14206865
          ABI: arm64-v8a
          Android API: 29
          STL: c++_static
          CPU profile: portable ARMv8-A
          ThinLTO: OFF
          PGO: OFF
          Purpose: identical-toolchain V16 baseline versus V17 candidate A/B pair
          Device speed claim: none until Samsung Galaxy S25 physical A/B test
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: Albay-V17-Phase2-ARM64-Pair
          if-no-files-found: error
          retention-days: 30
          path: /tmp/albay-v17/v17_phase2_ci_minimal/build/v17-phase2-arm64-pair/artifacts/
