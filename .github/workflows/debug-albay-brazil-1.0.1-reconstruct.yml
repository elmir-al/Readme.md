name: Debug Albay Brazilian 1.0.1 Reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_source/brazil101-part-*.b64"
      - ".github/workflows/debug-albay-brazil-1.0.1-reconstruct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture chunk diagnostics
        shell: bash
        run: |
          mkdir -p artifact
          set +e
          {
            echo '=== CHUNK SHA256 ==='
            sha256sum ci_source/brazil101-part-*.b64
            echo '=== CHUNK SHA1 BLOB ==='
            python3 - <<'PY'
          import hashlib, glob, pathlib
          for name in sorted(glob.glob('ci_source/brazil101-part-*.b64')):
              b=pathlib.Path(name).read_bytes()
              print(pathlib.Path(name).name, len(b), hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest())
          PY
            cat ci_source/brazil101-part-*.b64 > /tmp/brazil101.b64
            echo '=== CONCAT ==='
            wc -c /tmp/brazil101.b64
            sha256sum /tmp/brazil101.b64
            base64 --decode /tmp/brazil101.b64 > /tmp/brazil101.patch.gz
            echo decode_status=$?
            sha256sum /tmp/brazil101.patch.gz
            gzip -t /tmp/brazil101.patch.gz
            echo gzip_status=$?
          } > artifact/debug.log 2>&1
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-Brazilian-1.0.1-Chunk-Diagnostics
          path: artifact/
          if-no-files-found: error
          retention-days: 3
