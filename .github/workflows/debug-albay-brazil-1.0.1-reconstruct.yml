name: Debug Albay Brazilian 1.0.1 Reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_source/brazil101-part-*.b64"
      - ".github/workflows/debug-albay-brazil-1.0.1-reconstruct.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture full reconstruction diagnostics
        shell: bash
        run: |
          mkdir -p artifact
          set +e
          {
            cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
            echo base_decode=$?
            rm -rf /tmp/albay && mkdir -p /tmp/albay
            tar -xJf /tmp/albay.tar.xz -C /tmp/albay
            echo base_extract=$?
            SRC=/tmp/albay/albay_minimal
            patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
            echo shared_ptr_patch=$?
            patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
            echo eval_patch=$?
            patch -d "$SRC" -p1 --forward --batch < ci_source/russian_king_forced_continuation_1042.patch
            echo russian_rule_patch=$?
            cat ci_source/brazil101-part-*.b64 | base64 --decode | gzip -dc > /tmp/brazil101.patch
            echo brazil_decode=${PIPESTATUS[*]}
            sha256sum /tmp/brazil101.patch
            patch -d "$SRC" -p1 --batch --verbose < /tmp/brazil101.patch
            echo brazil_patch=$?
            echo '=== GATES ==='
            for spec in \
              'include/albay/types.hpp|kEngineVersion = "1.0.1"' \
              'include/albay/types.hpp|Albay Brazilian Draughts Engine' \
              'src/movegen.cpp|max_capture_count' \
              'src/position.cpp|draw_state_fingerprint' \
              'src/search.cpp|is_automatic_draw' \
              'include/albay/movegen.hpp|kInlineCapacity' \
              'src/notation.cpp|NP='; do
              file=${spec%%|*}; pattern=${spec#*|}
              grep -nF "$pattern" "$SRC/$file" | head -3
              echo "gate $file :: $pattern => ${PIPESTATUS[0]}"
            done
            echo '=== SOURCE FILES ==='
            find "$SRC" -maxdepth 2 -type f -printf '%P\n' | sort
          } > artifact/debug.log 2>&1
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-Brazilian-1.0.1-Full-Reconstruction-Diagnostics
          path: artifact/
          if-no-files-found: error
          retention-days: 3
