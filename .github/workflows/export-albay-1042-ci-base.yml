name: Export Albay 1.0.42 CI Base

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-albay-1042-ci-base.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact CI base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo "1f137dcfda27a3484f07e40c9e1dc38687f68f137777e626135425dd9cb4756e  /tmp/albay.tar.xz" | sha256sum -c --strict
          rm -rf /tmp/albay && mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          SRC=/tmp/albay/albay_minimal
          patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/russian_king_forced_continuation_1042.patch
          tar -czf artifact/albay-1.0.42-ci-base.tar.gz -C /tmp/albay albay_minimal
          sha256sum artifact/albay-1.0.42-ci-base.tar.gz > artifact/SHA256SUMS.txt
      - name: Upload exact base
        uses: actions/upload-artifact@v4
        with:
          name: Albay-1.0.42-Exact-CI-Base
          path: artifact/
          retention-days: 3
