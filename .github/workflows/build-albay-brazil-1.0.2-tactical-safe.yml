name: Build Albay Brazilian 1.0.2 TacticalSafe ARM64

on:
  pull_request:
    branches: [main]
    paths:
      - "ci_source/brazil102-tactical-safe.patch.gz.b64"
      - ".github/workflows/build-albay-brazil-1.0.2-tactical-safe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Brazilian 1.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          exec > >(tee artifact/reconstruct.log) 2>&1
          cat ci_source/part-*.b64 | base64 --decode > /tmp/albay.tar.xz
          echo "1f137dcfda27a3484f07e40c9e1dc38687f68f137777e626135425dd9cb4756e  /tmp/albay.tar.xz" | sha256sum -c --strict
          rm -rf /tmp/albay && mkdir -p /tmp/albay
          tar -xJf /tmp/albay.tar.xz -C /tmp/albay
          SRC=/tmp/albay/albay_minimal
          patch -d "$SRC" -p1 --forward --batch < ci_source/android_ndk_shared_ptr.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/evaluation_scale_compat.patch
          patch -d "$SRC" -p1 --forward --batch < ci_source/russian_king_forced_continuation_1042.patch

          OLD=658bbd987668156627e473fd302711de62f16347
          for n in 00 01 02 03 04 05 06 07; do
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/elmir-al/Readme.md/$OLD/ci_source/brazil101-part-$n.b64" \
              -o "/tmp/brazil101-part-$n.b64"
          done
          cat /tmp/brazil101-part-*.b64 | base64 --decode | gzip -dc > /tmp/brazil101.patch
          echo "f27fb87e3571826f41e9480d4c21cb7d864536caf7771c214a539a86bc08e9b8  /tmp/brazil101.patch" | sha256sum -c --strict
          patch -d "$SRC" -p1 --batch < /tmp/brazil101.patch || true
          sed -i 's/929907/929905/g' "$SRC/src/release.cpp"

          base64 --decode ci_source/brazil102-tactical-safe.patch.gz.b64 | gzip -dc > /tmp/brazil102.patch
          echo "9b18846b44371b6e0a93b1745189d9748c80514c92df2f1d971656f8ebdb5cb0  /tmp/brazil102.patch" | sha256sum -c --strict
          patch -d "$SRC" -p1 --batch < /tmp/brazil102.patch
          grep -q 'kEngineVersion = "1.0.2"' "$SRC/include/albay/types.hpp"
          grep -q 'kRootTacticalLiabilityPenalty = 1200' "$SRC/src/search.cpp"
          echo "Brazilian 1.0.2 tactical-safe source gates: PASS"

      - name: Upload reconstruction diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-Brazilian-1.0.2-Reconstruction-Failure
          path: artifact/reconstruct.log
          if-no-files-found: warn
          retention-days: 3

      - name: Install Android NDK r29
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Build portable Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_SDK_ROOT}/ndk/29.0.14206865"
          SRC=/tmp/albay/albay_minimal
          cmake -S "$SRC" -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DALBAY_BUILD_TESTS=OFF -DALBAY_BUILD_TOOLS=OFF -DALBAY_BUILD_JNI=OFF \
            -DALBAY_ENABLE_LTO=ON -DALBAY_ENABLE_THIN_LTO=OFF \
            -DALBAY_ENABLE_PGO_GENERATE=OFF -DALBAY_ENABLE_PGO_USE=OFF \
            -DALBAY_ANDROID_CPU_PROFILE=portable -DALBAY_ANDROID_16K_PAGE_ALIGNMENT=ON
          cmake --build build --target albay --parallel 2 --verbose 2>&1 | tee artifact/android-build.log

      - name: Verify ELF, API and package
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_SDK_ROOT}/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLS/llvm-strip" --strip-unneeded build/libalbay.so
          cp build/libalbay.so artifact/libalbay.so
          cp /tmp/albay/albay_minimal/include/albay/c_api.h artifact/albay_c_api.h
          "$TOOLS/llvm-readelf" -h artifact/libalbay.so > artifact/elf-header.log
          "$TOOLS/llvm-readelf" -d artifact/libalbay.so > artifact/dynamic-dependencies.log
          "$TOOLS/llvm-readelf" -l artifact/libalbay.so > artifact/program-headers.log
          "$TOOLS/llvm-nm" -D --defined-only artifact/libalbay.so > artifact/exports.log
          grep -Eq 'Machine:[[:space:]]+AArch64' artifact/elf-header.log
          grep -Eq 'Type:[[:space:]]+DYN' artifact/elf-header.log
          ! grep -Eq 'libstdc\+\+\.so\.6|libgcc_s\.so\.1|libc\+\+_shared\.so' artifact/dynamic-dependencies.log
          test "$(grep -Ec ' albay_engine_[A-Za-z0-9_]+$' artifact/exports.log)" -eq 27
          awk '$1 == "LOAD" {print}' artifact/program-headers.log > artifact/load-segments.log
          grep -Eq '0x0*4000([[:space:]]|$)' artifact/load-segments.log
          sha256sum artifact/libalbay.so > artifact/SHA256SUMS.txt
          cat > artifact/BUILD_INFO.json <<'EOF'
          {
            "engine": "Albay Brazilian Draughts Engine",
            "version": "1.0.2",
            "variant": "brazilian_draughts_8x8",
            "ndk": "29.0.14206865",
            "abi": "arm64-v8a",
            "minimum_android_api": 29,
            "cpp_runtime": "c++_static",
            "cpu_profile": "portable_armv8_a_lto",
            "elf_load_alignment": 16384,
            "c_api_exports": 27,
            "search_policy": "deterministic production worker plus root tactical liability guard"
          }
          EOF

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Albay-Brazilian-1.0.2-TacticalSafe-Android-arm64-v8a-NDK-r29
          path: artifact/
          if-no-files-found: error
          retention-days: 30
