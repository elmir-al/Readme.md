name: Albay v4.1.0-rc1 Reproducible Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'phase32_rc1_reproducible.sh'
      - 'phase29_v410_overlay10/**'
      - 'phase30_audit_android_elf.py'
      - 'phase30_audit_native_exports.py'
      - 'phase30_tb3_generate.cpp'
      - '.github/workflows/phase32-rc1-reproducible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-rc1-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build RC1 twice and compare byte-for-byte
        shell: bash
        run: bash phase32_rc1_reproducible.sh
      - name: Upload RC1 reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Albay-v4.1.0-rc1-Phase32-Reproducibility-Evidence-${{ github.run_number }}
          path: artifact-phase32-rc1/
          if-no-files-found: warn
          retention-days: 30
